services:
  node1:
    build: .
    environment:
      RAFT_NODE_ID: node1
      RAFT_PEERS: node2=node2:9091,node3=node3:9091
      RAFT_HTTP_PEERS: node2=http://localhost:8082,node3=http://localhost:8083
      RAFT_DATA_DIR: /data
    ports: ["8081:8080"]
    volumes: ["node1-data:/data"]
  node2:
    build: .
    environment:
      RAFT_NODE_ID: node2
      RAFT_PEERS: node1=node1:9091,node3=node3:9091
      RAFT_HTTP_PEERS: node1=http://localhost:8081,node3=http://localhost:8083
      RAFT_DATA_DIR: /data
    ports: ["8082:8080"]
    volumes: ["node2-data:/data"]
  node3:
    build: .
    environment:
      RAFT_NODE_ID: node3
      RAFT_PEERS: node1=node1:9091,node2=node2:9091
      RAFT_HTTP_PEERS: node1=http://localhost:8081,node2=http://localhost:8082
      RAFT_DATA_DIR: /data
    ports: ["8083:8080"]
    volumes: ["node3-data:/data"]

volumes:
  node1-data:
  node2-data:
  node3-data:
