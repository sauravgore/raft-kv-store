syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.example.raftkv.grpc";
option java_outer_classname = "RaftProtocol";

package raft;

service RaftRpc {
  rpc RequestVote (VoteRequest) returns (VoteResponse);
  rpc AppendEntries (AppendRequest) returns (AppendResponse);
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message VoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int32 last_log_index = 3;
  int64 last_log_term = 4;
}
message VoteResponse { int64 term = 1; bool vote_granted = 2; }
message LogEntry { int64 term = 1; string operation = 2; string key = 3; string value = 4; }
message AppendRequest {
  int64 term = 1;
  string leader_id = 2;
  int32 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int32 leader_commit = 6;
}
message AppendResponse { int64 term = 1; bool success = 2; int32 match_index = 3; }
message SnapshotKeyValue { string key = 1; string value = 2; }
message SnapshotPartition { int32 partition_id = 1; repeated SnapshotKeyValue entries = 2; }
message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  int32 last_included_index = 3;
  int64 last_included_term = 4;
  repeated SnapshotPartition partitions = 5;
}
message InstallSnapshotResponse { int64 term = 1; bool success = 2; }
